<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You | GharEx</title>
  <meta name="description" content="Thank you for registering with GharEx.">
  <link rel="stylesheet" href="style.css">
</head>
<body class="registration-page thank-you-page">
  <header class="site-header">
    <nav class="nav" aria-label="Main navigation">
      <a class="brand brand-logo" href="index.html" aria-label="GharEx home">
        <span class="brand-main">Ghar</span><span class="brand-accent">Ex</span><sup>TM</sup>
      </a>
      <div class="nav-links">
        <a href="index.html#about">About</a>
        <a href="index.html#contact">Contact</a>
      </div>
      <a class="nav-cta" href="https://wa.me/918409734846" target="_blank" rel="noopener">WhatsApp</a>
    </nav>
  </header>

  <main class="thank-you-main">
    <section class="thank-you-card" aria-labelledby="thankYouTitle">
      <span class="thank-you-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="m10.2 15.3 6.9-6.9 1.4 1.4-8.3 8.3-4.7-4.7 1.4-1.4 3.3 3.3Z"/>

      </span>
      <p class="eyebrow dark">Registration Submitted</p>

      <p id="thankYouMessage">
        Your registration has been received by GharEx. Our team will review your details and contact you shortly to discuss the next step.
      </p>
      <div class="thank-you-actions">
        <a class="button primary" href="index.html">Back to Home</a>
        <a class="button secondary" href="https://wa.me/918409734846" target="_blank" rel="noopener">Chat on WhatsApp</a>

  <script src="script.js"></script>
